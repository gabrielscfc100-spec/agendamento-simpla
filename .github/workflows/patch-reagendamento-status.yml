name: Ajustar status no reagendamento
on:
  push:
    paths:
      - '.github/workflows/patch-reagendamento-status.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch-reagendamento-status.py
      - name: Validar alteracao
        run: |
          grep -q "NOVO HORÁRIO AGUARDANDO CONFIRMAÇÃO" index.html
          grep -q "permanece confirmado" index.html
      - name: Commit e limpeza
        run: |
          rm -f scripts/patch-reagendamento-status.py .github/workflows/patch-reagendamento-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: respeitar status no reagendamento do portal"
          git push
