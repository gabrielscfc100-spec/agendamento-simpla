name: Corrigir slug no caminho da agenda
on:
  push:
    paths:
      - 'scripts/patch-slug-path.py'
      - '.github/workflows/patch-slug-path.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/patch-slug-path.py
      - name: Commit e limpeza
        run: |
          rm -f scripts/patch-slug-path.py .github/workflows/patch-slug-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: aceitar slug da empresa no caminho da agenda"
          git push
