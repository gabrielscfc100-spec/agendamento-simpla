name: Validar telefone no agendamento externo

on:
  push:
    paths:
      - '.github/workflows/patch-identidade-telefone.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: python tools/patch-identidade-telefone.py

      - name: Validar alteração
        run: |
          grep -q "agendamento_publico_validar_identidade" index.html
          grep -q "TELEFONE_EM_USO" index.html
          git diff --check

      - name: Commit e limpeza
        run: |
          rm -f tools/patch-identidade-telefone.py .github/workflows/patch-identidade-telefone.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validar telefone compartilhado no agendamento externo"
          git push
